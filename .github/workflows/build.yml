name: Build APK

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_KEYSTORE: ${{ secrets.KEYSTORE_B64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3
        with:
          # the default includes the legacy 'tools' package, which no longer exists
          packages: platform-tools

      - uses: gradle/actions/setup-gradle@v4

      - name: Decode signing key
        if: env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build
        env:
          WTR_KEYSTORE: ${{ runner.temp }}/release.jks
          WTR_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          WTR_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          WTR_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk web-tv-remote.apk

      - uses: actions/upload-artifact@v4
        with:
          name: web-tv-remote
          path: web-tv-remote.apk

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: web-tv-remote.apk
