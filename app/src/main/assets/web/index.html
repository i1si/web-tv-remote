<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#0b0d12">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="TV Remote">
  <title>TV Remote</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="stylesheet" href="/app.css">
</head>
<body>
  <!-- SVG icon sprite -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <symbol id="i-power" viewBox="0 0 24 24"><path d="M12 3v9"/><path d="M6.4 6.6a8 8 0 1 0 11.2 0"/></symbol>
      <symbol id="i-keyboard" viewBox="0 0 24 24"><rect x="2.5" y="6" width="19" height="12" rx="2.5"/><path d="M6.5 10h.01M10 10h.01M14 10h.01M17.5 10h.01M8 14h8"/></symbol>
      <symbol id="i-settings" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></symbol>
      <symbol id="i-chev" viewBox="0 0 24 24"><path d="m6 15 6-6 6 6"/></symbol>
      <symbol id="i-back" viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></symbol>
      <symbol id="i-home" viewBox="0 0 24 24"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></symbol>
      <symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></symbol>
      <symbol id="i-vol-down" viewBox="0 0 24 24"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 12h5"/></symbol>
      <symbol id="i-vol-up" viewBox="0 0 24 24"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 12h5M18 9.5v5"/></symbol>
      <symbol id="i-edit" viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></symbol>
      <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
      <symbol id="i-x" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></symbol>
      <symbol id="i-up" viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></symbol>
      <symbol id="i-del" viewBox="0 0 24 24"><path d="M21 5H8l-6 7 6 7h13a1 1 0 0 0 1-1V6a1 1 0 0 0-1-1z"/><path d="m16 9-6 6M10 9l6 6"/></symbol>
      <symbol id="i-enter" viewBox="0 0 24 24"><path d="M20 4v7a4 4 0 0 1-4 4H4"/><path d="m9 10-5 5 5 5"/></symbol>
    </defs>
  </svg>

  <!-- Pairing -->
  <main id="pair" class="screen pair" hidden>
    <div class="pair-card">
      <svg class="logo" viewBox="0 0 108 108" aria-hidden="true"><circle cx="54" cy="54" r="26" fill="none" stroke="#4f8cff" stroke-width="8"/><circle cx="54" cy="54" r="9" fill="#fff"/></svg>
      <h1 data-i18n="pairTitle"></h1>
      <p class="muted" id="pair-device"></p>
      <p data-i18n="pairHint"></p>
      <input id="pin" class="pin-input" inputmode="numeric" pattern="[0-9]*" maxlength="4" autocomplete="one-time-code" placeholder="••••">
      <p id="pair-error" class="error" role="alert"></p>
      <button id="pair-go" class="primary" data-i18n="pairButton"></button>
      <button id="pair-again" class="link" data-i18n="pairAgain"></button>
    </div>
  </main>

  <!-- Remote -->
  <main id="remote" class="screen remote" hidden>
    <header class="status">
      <span id="dot" class="dot"></span>
      <span id="device" class="device"></span>
    </header>
    <button id="limited" class="limited" hidden></button>
    <a id="name-link" class="name-link" hidden></a>

    <section class="row top">
      <button class="round danger" data-key="power" data-i18n-label="power"><svg><use href="#i-power"/></svg></button>
      <button class="round" id="btn-keyboard" data-i18n-label="keyboard"><svg><use href="#i-keyboard"/></svg></button>
      <button class="round" data-key="settings" data-i18n-label="settings"><svg><use href="#i-settings"/></svg></button>
    </section>

    <section class="dpad" aria-label="D-pad">
      <button class="dir up" data-key="up" data-repeat data-i18n-label="up"><svg><use href="#i-chev"/></svg></button>
      <button class="dir right" data-key="right" data-repeat data-i18n-label="right"><svg><use href="#i-chev"/></svg></button>
      <button class="dir down" data-key="down" data-repeat data-i18n-label="down"><svg><use href="#i-chev"/></svg></button>
      <button class="dir left" data-key="left" data-repeat data-i18n-label="left"><svg><use href="#i-chev"/></svg></button>
      <button class="ok" data-key="ok" data-long data-i18n="ok"></button>
    </section>

    <section class="row">
      <button class="round" data-key="back" data-long data-i18n-label="back"><svg><use href="#i-back"/></svg></button>
      <button class="round" data-key="home" data-long data-i18n-label="home"><svg><use href="#i-home"/></svg></button>
      <button class="round" data-key="menu" data-i18n-label="menu"><svg><use href="#i-menu"/></svg></button>
    </section>

    <section class="row volume">
      <button class="pill" data-key="volume_down" data-repeat data-i18n-label="volDown"><svg><use href="#i-vol-down"/></svg><span data-i18n="volDown"></span></button>
      <input id="volume" class="vol-slider" type="range" min="0" max="15" step="1" value="0" data-i18n-label="volume">
      <button class="pill" data-key="volume_up" data-repeat data-i18n-label="volUp"><svg><use href="#i-vol-up"/></svg><span data-i18n="volUp"></span></button>
    </section>

    <section class="apps" id="apps" aria-label="Apps"></section>
  </main>

  <!-- Sheets -->
  <div id="backdrop" class="backdrop" hidden></div>

  <div id="sheet-keyboard" class="sheet" hidden role="dialog">
    <h2 data-i18n="keyboardTitle"></h2>
    <input id="kb-input" class="kb-input" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" enterkeyhint="send" data-i18n-placeholder="keyboardPlaceholder">
    <div class="kb-actions">
      <button class="secondary" id="kb-clear" data-i18n="clear"></button>
      <button class="secondary icon-only" id="kb-del" data-repeat-del data-i18n-label="backspace"><svg><use href="#i-del"/></svg></button>
      <button class="primary" id="kb-enter"><svg><use href="#i-enter"/></svg><span data-i18n="enter"></span></button>
    </div>
    <button class="link" data-close data-i18n="done"></button>
  </div>

  <div id="sheet-apps" class="sheet tall" hidden role="dialog">
    <div class="sheet-head">
      <h2 data-i18n="appsTitle"></h2>
      <button class="round small" data-close data-i18n-label="done"><svg><use href="#i-x"/></svg></button>
    </div>
    <h3 data-i18n="favorites"></h3>
    <ul id="fav-list" class="list"></ul>
    <h3 data-i18n="allApps"></h3>
    <input id="app-search" class="search" type="search" data-i18n-placeholder="search">
    <ul id="all-list" class="list"></ul>
  </div>

  <div id="toast" class="toast" role="status" hidden></div>

  <script src="/app.js"></script>
</body>
</html>
